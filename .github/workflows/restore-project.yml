name: Restore verified project
on:
  push:
    paths:
      - '.github/workflows/restore-project.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency: restore-legal-project
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and unpack clean source
        run: |
          python - <<'PY'
          import hashlib, pathlib, zipfile, re
          archive = pathlib.Path('Legal_ready_to_upload.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '73193686e7cd1d45bab730f265e213b1802c54c3c4f90ac276564ef7b993163f'
          target = pathlib.Path('.recovery').resolve()
          target.mkdir()
          with zipfile.ZipFile(archive) as z:
              for entry in z.infolist():
                  path = pathlib.PurePosixPath(entry.filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert '.git' not in path.parts and '.env' not in path.parts
                  if entry.is_dir():
                      continue
                  data = z.read(entry)
                  assert not re.search(rb'AIza[0-9A-Za-z_-]{25,}|AQ\.[0-9A-Za-z_-]{25,}', data)
                  dest = target / path
                  assert dest.resolve().is_relative_to(target)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(data)
          PY
      - name: Install dependencies and test all services
        working-directory: .recovery
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Replace broken layout with tested sources
        run: |
          python - <<'PY'
          import pathlib, subprocess, shutil
          root = pathlib.Path.cwd().resolve()
          source = root / '.recovery'
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          for name in filter(None, tracked):
              path = (root / name).resolve()
              assert path.is_relative_to(root) and '.git' not in pathlib.PurePosixPath(name).parts
              path.unlink()
          for path in source.rglob('*'):
              if path.is_file() and '__pycache__' not in path.parts:
                  dest = root / path.relative_to(source)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(path, dest)
          assert source.resolve() == root / '.recovery'
          shutil.rmtree(source)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore working Flask project and remove obsolete files and embedded credentials'
          git push origin HEAD:main
